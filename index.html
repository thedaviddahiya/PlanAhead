<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create a poll | PlanAhead</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/create.js"></script>
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <h1>PlanAhead</h1>
      <p>Find a time that works for everyone.</p>
    </header>

    <section class="card" aria-labelledby="create-heading">
      <h2 id="create-heading">Create a poll</h2>
      <div id="setup-notice" class="notice" hidden>
        Supabase is not configured yet. Add your project details in <a href="README.md#setup">the setup guide</a>.
      </div>
      <form id="create-form">
        <label for="title">Title</label>
        <input id="title" name="title" type="text" maxlength="200" required>

        <label for="description">Description <span>(optional)</span></label>
        <textarea id="description" name="description" maxlength="2000" rows="3"></textarea>

        <fieldset>
          <legend>Pick the days, then add times in each day's popup</legend>
          <div class="calendar-block">
            <div class="cal-toolbar">
              <button type="button" id="cal-prev" class="cal-nav" aria-label="Previous month">‹</button>
              <span id="cal-month" aria-live="polite"></span>
              <button type="button" id="cal-next" class="cal-nav" aria-label="Next month">›</button>
            </div>
            <div class="cal-grid" id="cal-grid"></div>
          </div>
          <div id="day-popover" class="day-popover" hidden tabindex="-1">
            <div class="popover-title" id="popover-title"></div>
            <div class="slot-chips" id="slot-chips"></div>
            <div class="custom-row">
              <input id="exact-time" type="time" aria-label="Exact time">
              <button type="button" id="add-exact">Add time</button>
            </div>
            <div class="custom-row">
              <input id="range-start" type="time" aria-label="Range start">
              <span class="range-dash">–</span>
              <input id="range-end" type="time" aria-label="Range end">
              <button type="button" id="add-range">Add range</button>
            </div>
            <div class="popover-error" id="popover-error" role="alert" aria-live="polite"></div>
            <ul id="day-chosen" class="chosen-list"></ul>
            <div class="popover-actions">
              <button type="button" id="clear-day">Clear day</button>
              <button type="button" id="done-day">Done</button>
            </div>
          </div>
          <div class="popover-backdrop" id="popover-backdrop" hidden></div>
          <ul id="options-list" aria-live="polite"></ul>
        </fieldset>

        <div id="create-error" class="error" role="alert" aria-live="polite"></div>
        <button type="submit">Create poll</button>
      </form>
    </section>

    <section id="result-panel" class="card" hidden aria-labelledby="result-heading">
      <h2 id="result-heading">Your poll is ready</h2>
      <p>Share this link with your group:</p>
      <p id="share-link" class="share-link"></p>
      <div class="result-actions">
        <button id="copy-link" type="button">Copy link</button>
        <a id="open-poll" class="button" href="">Open poll</a>
      </div>
    </section>
  </main>
</body>
</html>
